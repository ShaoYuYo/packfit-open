name: Publish PackFit Visual Engineering Beta

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v08.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-workbench-v0.8.0-beta.1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v4

      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check browser app syntax and source integrity
        run: npm run check

      - name: Run browser calculation and privacy regression tests
        run: npm test

      - name: Prepare .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run battery engineering core test vectors
        shell: pwsh
        run: |
          dotnet run --project desktop/PackFit.Engineering.Checks/PackFit.Engineering.Checks.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Engineering checks failed" }

      - name: Build self-contained native WinUI 3 executable
        shell: pwsh
        run: |
          dotnet publish desktop/PackFit.Engineering.Desktop/PackFit.Engineering.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output dist/PackFit-Engineering-WinUI -p:Platform=x64 -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -p:PublishSingleFile=false
          if ($LASTEXITCODE -ne 0) { throw "WinUI publish failed" }
          if (!(Test-Path "dist/PackFit-Engineering-WinUI/PackFit.Engineering.exe")) { throw "WinUI executable was not produced" }
          if (!(Test-Path "dist/PackFit-Engineering-WinUI/Start-PackFit.cmd")) { throw "Startup launcher was not packaged" }
          if (!(Test-Path "dist/PackFit-Engineering-WinUI/Diagnostics/Diagnose-PackFit.ps1")) { throw "Local diagnostic script was not packaged" }
          $native = @(Get-ChildItem "dist/PackFit-Engineering-WinUI" -Filter *.dll -File)
          Write-Host "Bundled DLLs next to EXE: $($native.Count)"
          if ($native.Count -lt 10) { throw "Self-contained runtime appears incomplete" }
          Compress-Archive -Path "dist/PackFit-Engineering-WinUI/*" -DestinationPath "dist/PackFit-Engineering-win-x64.zip" -Force

      - name: Exploratory launch probe on hosted Windows (not hardware certification)
        id: launch_probe
        shell: pwsh
        continue-on-error: true
        run: |
          $path = (Resolve-Path "dist/PackFit-Engineering-WinUI/PackFit.Engineering.exe").Path
          $dir = Split-Path $path -Parent
          try {
            $proc = Start-Process -FilePath $path -WorkingDirectory $dir -ArgumentList '--safe-ui' -PassThru
            Start-Sleep -Seconds 7
            $proc.Refresh()
            if ($proc.HasExited) {
              Write-Warning "PackFit exited during CI launch (exit code $($proc.ExitCode)). Hosted runners may not offer an interactive desktop."
              $log = Join-Path $env:LOCALAPPDATA "PackFitOpen/Logs/startup.log"
              if (Test-Path $log) { Get-Content $log -Tail 25 }
              throw "Hosted runner startup process exited"
            }
            Write-Host "PackFit process remained active 7 seconds in hosted Windows. This does not verify UI usability."
            Stop-Process -Id $proc.Id -Force
          }
          catch {
            Write-Warning ("Hosted Windows GUI probe inconclusive: " + $_.Exception.Message)
            throw
          }

      - name: Verify XAML-independent compatibility workspace
        shell: pwsh
        run: |
          $path = (Resolve-Path "dist/PackFit-Engineering-WinUI/PackFit.Engineering.exe").Path
          $folder = Split-Path $path -Parent
          $proc = Start-Process -FilePath $path -WorkingDirectory $folder -ArgumentList '--selftest-compat' -PassThru
          if (!$proc.WaitForExit(20000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "XAML-independent compatibility smoke test timed out"
          }
          $log = Join-Path $env:LOCALAPPDATA "PackFitOpen/Logs/startup.log"
          if (Test-Path $log) { Get-Content $log -Tail 20 }
          if ($proc.ExitCode -ne 0 -or !(Test-Path $log) -or
              !(Select-String -Path $log -Pattern 'Compatibility self-test: COMPAT_WINDOW_OK' -Quiet)) {
            throw "Compatible WinUI engineering workbench did not construct"
          }

      - name: Assert full and compatible native visuals with synthetic engineering data
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/PackFit-Engineering-WinUI/PackFit.Engineering.exe").Path
          $folder = Split-Path $exe -Parent
          $log = Join-Path $env:LOCALAPPDATA "PackFitOpen/Logs/startup.log"
          $checks = @(
            @{ Arg = '--selftest-xaml'; Marker = 'XAML self-test: MAIN_WINDOW_OK' },
            @{ Arg = '--selftest-compat'; Marker = 'Compatibility self-test: COMPAT_WINDOW_OK' },
            @{ Arg = '--selftest-visuals'; Marker = 'Engineering visuals self-test: VISUALS_OK' },
            @{ Arg = '--selftest-compat-visuals'; Marker = 'Compatibility visuals self-test: COMPAT_VISUALS_OK' }
          )
          foreach ($check in $checks) {
            Remove-Item $log -ErrorAction SilentlyContinue
            $proc = Start-Process -FilePath $exe -WorkingDirectory $folder -ArgumentList $check.Arg -PassThru
            if (!$proc.WaitForExit(30000)) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              throw "Native WinUI smoke test timed out: $($check.Arg)"
            }
            if (Test-Path $log) { Get-Content $log -Tail 22 }
            if ($proc.ExitCode -ne 0 -or !(Test-Path $log) -or
                !(Select-String -Path $log -Pattern $check.Marker -SimpleMatch -Quiet)) {
              throw "Native UI did not construct expected diagrams/workflows: $($check.Arg), exit $($proc.ExitCode)"
            }
          }

      - name: Attempt optional single-file EXE
        id: portable
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet publish desktop/PackFit.Engineering.Desktop/PackFit.Engineering.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output dist/portable -p:Platform=x64 -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -p:PublishSingleFile=true -p:EnableMsixTooling=true -p:IncludeAllContentForSelfExtract=true
          if ($LASTEXITCODE -ne 0) { throw "Optional single-file build unavailable" }
          if (!(Test-Path "dist/portable/PackFit.Engineering.exe")) { throw "Optional single-file EXE not found" }
          # CRITICAL: Never rename a self-contained WinUI EXE after publishing.
          # WinUI resource URI lookup may depend on the original assembly/EXE name.
          Write-Host "Portable executable preserves original name: PackFit.Engineering.exe"

      - name: Create SHA256 file for release assets
        shell: pwsh
        run: |
          $assets = @("dist/PackFit-Engineering-win-x64.zip")
          if (Test-Path "dist/portable/PackFit.Engineering.exe") { $assets += "dist/portable/PackFit.Engineering.exe" }
          $lines = foreach ($path in $assets) {
            $hash = Get-FileHash $path -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $(Split-Path $path -Leaf)"
          }
          $lines | Set-Content -Path "dist/SHA256SUMS.txt" -Encoding utf8

      - name: Publish prerelease from this exact verified commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v0.8.0-beta.1"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" --json url *> $null
          if ($LASTEXITCODE -eq 0) { throw "Beta release already exists. Do not silently overwrite its files or tag." }
          $files = @("dist/PackFit-Engineering-win-x64.zip","dist/SHA256SUMS.txt")
          if (Test-Path "dist/portable/PackFit.Engineering.exe") { $files += "dist/portable/PackFit.Engineering.exe" }
          gh release create $tag $files --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "PackFit Open v0.8.0-beta.1 — Visual Battery Engineering Workbench" --notes-file "docs/RELEASE_NOTES_v0.8.0-beta.1.md" --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw "GitHub prerelease publication failed" }
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" --json url,assets,isPrerelease
          if ($LASTEXITCODE -ne 0) { throw "Cannot verify published release" }
