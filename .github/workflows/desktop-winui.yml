name: Build Windows WinUI Desktop

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-winui.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-winui.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check standalone engineering calculations
        shell: pwsh
        run: dotnet run --project desktop/PackFit.Engineering.Checks/PackFit.Engineering.Checks.csproj --configuration Release

      - name: Publish self-contained WinUI 3 application folder
        shell: pwsh
        run: |
          dotnet publish desktop/PackFit.Engineering.Desktop/PackFit.Engineering.Desktop.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            --output "dist/PackFit-Engineering-WinUI" `
            -p:Platform=x64 -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true -p:PublishSingleFile=false
          if ($LASTEXITCODE -ne 0) { throw "WinUI 3 publish failed" }
          if (!(Test-Path "dist/PackFit-Engineering-WinUI/PackFit.Engineering.exe")) {
            throw "Expected native WinUI executable was not produced"
          }

      - name: Assert real WinUI MainWindow XAML loads (not recovery window)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/PackFit-Engineering-WinUI/PackFit.Engineering.exe").Path
          $folder = Split-Path $exe -Parent
          $proc = Start-Process -FilePath $exe -WorkingDirectory $folder -ArgumentList '--selftest-xaml' -PassThru
          if (!$proc.WaitForExit(20000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Native XAML self-test timed out"
          }
          $log = Join-Path $env:LOCALAPPDATA "PackFitOpen/Logs/startup.log"
          if (Test-Path $log) { Get-Content $log -Tail 36 }
          if ($proc.ExitCode -ne 0) {
            throw "MainWindow failed native XAML load, exit code $($proc.ExitCode) — CI must not accept RecoveryWindow"
          }
          if (!(Test-Path $log) -or !(Select-String -Path $log -Pattern 'XAML self-test: MAIN_WINDOW_OK' -Quiet)) {
            throw "Expected MainWindow XAML success marker was not produced"
          }

      - name: Assert XAML-independent compatible engineering workspace works
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/PackFit-Engineering-WinUI/PackFit.Engineering.exe").Path
          $folder = Split-Path $exe -Parent
          $proc = Start-Process -FilePath $exe -WorkingDirectory $folder -ArgumentList '--selftest-compat' -PassThru
          if (!$proc.WaitForExit(20000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Compatible WinUI workspace test timed out"
          }
          $log = Join-Path $env:LOCALAPPDATA "PackFitOpen/Logs/startup.log"
          if (Test-Path $log) { Get-Content $log -Tail 15 }
          if ($proc.ExitCode -ne 0 -or !(Test-Path $log) -or
              !(Select-String -Path $log -Pattern 'Compatibility self-test: COMPAT_WINDOW_OK' -Quiet)) {
            throw "XAML-independent compatibility workbench failed"
          }

      - name: Assert native diagrams and demo workflows actually construct
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/PackFit-Engineering-WinUI/PackFit.Engineering.exe").Path
          $folder = Split-Path $exe -Parent
          $log = Join-Path $env:LOCALAPPDATA "PackFitOpen/Logs/startup.log"
          foreach ($check in @(
            @{ Arg = '--selftest-visuals'; Marker = 'Engineering visuals self-test: VISUALS_OK' },
            @{ Arg = '--selftest-compat-visuals'; Marker = 'Compatibility visuals self-test: COMPAT_VISUALS_OK' }
          )) {
            Remove-Item $log -ErrorAction SilentlyContinue
            $proc = Start-Process -FilePath $exe -WorkingDirectory $folder -ArgumentList $check.Arg -PassThru
            if (!$proc.WaitForExit(30000)) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              throw "Visual smoke test timed out: $($check.Arg)"
            }
            if (Test-Path $log) { Get-Content $log -Tail 32 }
            if ($proc.ExitCode -ne 0 -or !(Test-Path $log) -or
                !(Select-String -Path $log -Pattern $check.Marker -SimpleMatch -Quiet)) {
              throw "Native data chart or demo workflow failed: $($check.Arg) code $($proc.ExitCode)"
            }
          }

      - name: Package complete desktop application
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/PackFit-Engineering-WinUI/*" `
            -DestinationPath "dist/PackFit-Engineering-win-x64.zip" -Force

      - name: Attest Windows ZIP build provenance on trusted pushes
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: dist/PackFit-Engineering-win-x64.zip

      - name: Upload working Windows executable and dependencies
        uses: actions/upload-artifact@v4
        with:
          name: PackFit-Engineering-WinUI-win-x64
          path: dist/PackFit-Engineering-win-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Try Microsoft's optional single-file WinUI publishing mode
        id: portable_exe
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet publish desktop/PackFit.Engineering.Desktop/PackFit.Engineering.Desktop.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            --output "dist/portable" `
            -p:Platform=x64 -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true -p:PublishSingleFile=true `
            -p:EnableMsixTooling=true -p:IncludeAllContentForSelfExtract=true
          if ($LASTEXITCODE -ne 0) { throw "Optional single-file publication failed" }

      - name: Upload optional single-file EXE if generated
        if: steps.portable_exe.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: PackFit-Engineering-single-EXE-win-x64
          path: dist/portable/PackFit.Engineering.exe
          if-no-files-found: warn
          retention-days: 30
