name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

# Cancel superseded pull-request checks; never cancel trusted main-branch,
# scheduled, or manual jobs. This reduces wasted hosted Windows CI time.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run dependency-free tests
        run: npm test
      - name: Validate static entry point
        run: test -f index.html && test -f styles.css && test -f assets/logo.svg

  engineering-cli:
    name: Offline engineering CLI (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test cross-platform core calculations
        run: dotnet run --project desktop/PackFit.Engineering.Checks --configuration Release
      - name: Test local telemetry and before/after JSON handoff
        shell: bash
        run: |
          dotnet run --project desktop/PackFit.Engineering.Cli --configuration Release -- compare \
            desktop/samples/telemetry-sample.csv \
            desktop/samples/telemetry-after-synthetic.csv \
            --min-voltage 11 --format json > "$RUNNER_TEMP/packfit-compare.json"
          python3 - "$RUNNER_TEMP/packfit-compare.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as f:
              result=json.load(f)
          assert result["kind"]=="screening-comparison"
          assert result["appliedThresholds"]["MinimumVoltageV"]==11
          assert result["appliedThresholds"]["PositiveCurrentMeansDischarge"] is True
          codes={row["code"]:row for row in result["findings"]}
          assert codes["TEMP_HIGH"]["baselineCount"]==1
          assert codes["TEMP_HIGH"]["candidateCount"]==0
          assert codes["VOLTAGE_LOW"]["deltaCount"]==-1
          assert len(result["cautions"])>=3
          assert "safety" in result["verdict"]
          PY
          dotnet run --project desktop/PackFit.Engineering.Cli --configuration Release -- telemetry \
            desktop/samples/telemetry-sample.csv --format markdown > "$RUNNER_TEMP/packfit-report.md"
          grep -q "Telemetry screening" "$RUNNER_TEMP/packfit-report.md"
      - name: Verify irregular layout optimizer, clearance and bounded JSON handoff
        shell: bash
        run: |
          dotnet run --project desktop/PackFit.Engineering.Cli --configuration Release -- layout \
            desktop/samples/irregular-layout-synthetic.json --format json > "$RUNNER_TEMP/layout.json"
          python3 - "$RUNNER_TEMP/layout.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as f: data=json.load(f)
          assert data["kind"]=="irregular-battery-layout-screening"
          opts=data["result"]["Options"]
          assert len(opts)>=2,opts
          long=[o for o in opts if o["CellId"]=="SYNTH-LONG-65x55" and o["Topology"]["Series"]==3][0]
          compact=[o for o in opts if o["CellId"]=="SYNTH-COMPACT-42x55" and o["Topology"]["Series"]==4][0]
          assert abs(long["NominalEnergyWh"]-57.75)<1e-6,long
          assert long["MeetsEnergyTarget"] is True
          assert compact["MeetsEnergyTarget"] is False
          assert len(long["Placements"])==3
          assert not any(o["CellId"]=="SYNTH-LONG-65x55" and o["Topology"]["Series"]==4 for o in opts)
          assert "NOT a global optimum" in data["status"]
          assert data["result"]["TotalZoneVolumeL"]>0
          PY
          dotnet run --project desktop/PackFit.Engineering.Cli --configuration Release -- layout \
            desktop/samples/irregular-layout-synthetic.json --format markdown > "$RUNNER_TEMP/layout.md"
          grep -q "NOT AN OPTIMALITY CERTIFICATE" "$RUNNER_TEMP/layout.md"
          grep -q "Gross XY cell fill" "$RUNNER_TEMP/layout.md"
          dotnet run --project desktop/PackFit.Engineering.Cli --configuration Release -- layout \
            desktop/samples/irregular-layout-synthetic.json --output "$RUNNER_TEMP/geometry.md"
          if dotnet run --project desktop/PackFit.Engineering.Cli --configuration Release -- layout \
            desktop/samples/irregular-layout-synthetic.json --output "$RUNNER_TEMP/geometry.md"; then
            echo "Expected existing geometry output to remain untouched";exit 1
          fi
      - name: Refuse output overwrite and oversized local file
        shell: bash
        run: |
          dotnet run --project desktop/PackFit.Engineering.Cli --configuration Release -- telemetry \
            desktop/samples/telemetry-sample.csv --output "$RUNNER_TEMP/packfit-one.md"
          test -s "$RUNNER_TEMP/packfit-one.md"
          if dotnet run --project desktop/PackFit.Engineering.Cli --configuration Release -- telemetry \
            desktop/samples/telemetry-sample.csv --output "$RUNNER_TEMP/packfit-one.md"; then
            echo "Expected output overwrite to be refused"; exit 1
          fi
          python3 - "$RUNNER_TEMP/large.csv" <<'PY'
          import sys
          with open(sys.argv[1],"wb") as f:
              f.write(b"x"*12_000_001)
          PY
          if dotnet run --project desktop/PackFit.Engineering.Cli --configuration Release -- telemetry \
            "$RUNNER_TEMP/large.csv"; then
            echo "Expected oversized CSV to be refused"; exit 1
          fi
